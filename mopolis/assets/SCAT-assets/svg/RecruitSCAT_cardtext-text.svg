         id="tspan34"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan8">Example Buster --------------------------------
</tspan></tspan><tspan
         x="6.6490269"
         y="43.09166"
         id="tspan36"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan35">If you control an &quot;Aqua&quot; unit: You can play </tspan></tspan><tspan
         x="6.6490269"
         y="44.842762"
         id="tspan38"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan37">this unit from your hand for no energy cost.
</tspan></tspan><tspan
         x="6.6490269"
         y="46.593865"
         id="tspan40"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan39">
</tspan></tspan><tspan
         x="6.6490269"
         y="48.344967"
         id="tspan42"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan41">When this unit is played: You can use an </tspan></tspan><tspan
         x="6.6490269"
         y="50.096069"
         id="tspan44"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan43">energy to target a unit your opponent </tspan></tspan><tspan
         x="6.6490269"
         y="51.847172"
         id="tspan46"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan45">controls and decrease its VT by 30, and if </tspan></tspan><tspan
         x="6.6490269"
         y="53.598274"
         id="tspan48"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan47">you control an &quot;Aqua&quot; unit, you can decrease </tspan></tspan><tspan
         x="6.6490269"
         y="55.349377"
         id="tspan50"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan49">its VT by another 30.
</tspan></tspan><tspan
         x="6.6490269"
         y="57.100479"
         id="tspan52"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan51">
</tspan></tspan><tspan
         x="6.6490269"
         y="58.851582"
         id="tspan54"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan53">Once per turn: You can use an energy to </tspan></tspan><tspan
         x="6.6490269"
         y="60.602684"
         id="tspan56"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan55">equip this card to your Champion.
</tspan></tspan><tspan
         x="6.6490269"
         y="62.353787"
         id="tspan58"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan57">
</tspan></tspan><tspan
         x="6.6490269"
         y="64.104889"
         id="tspan60"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan59">When this Overlay unit is sent to the GY: You </tspan></tspan><tspan
         x="6.6490269"
         y="65.855988"
         id="tspan62"><tspan
           style="font-stretch:condensed;font-family:'Barlow Condensed';-inkscape-font-specification:'Barlow Condensed,  Condensed'"
           id="tspan61">can target one unit your opponent controls, </tspan></tspan><tspan
